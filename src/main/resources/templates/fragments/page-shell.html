<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Unified app page header (matches System Dashboard / System Health) -->
<header th:fragment="page-header (title, searchPlaceholder, searchId, showSearch, fixed, showNotifications, showSettings, showUser)"
        class="bre-dashboard-header bre-page-header h-16 bg-surface border-b border-outline-variant flex items-center px-unit-xl z-40"
        th:classappend="${fixed} ? ' bre-page-header--fixed' : ' shrink-0 w-full'">
    <div class="bre-page-header__start flex items-center gap-unit-lg min-w-0">
        <h2 class="bre-page-title font-headline-sm text-headline-sm font-bold text-primary shrink-0" th:text="${title}">Page</h2>
        <div th:if="${showSearch and searchPlaceholder != null}"
             class="bre-page-header__search relative max-w-md ml-unit-xl">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg pointer-events-none">search</span>
            <input type="search"
                   class="bre-page-header__search-input w-full bg-surface-container-low border border-outline-variant rounded-lg py-2 pl-10 pr-4 text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all"
                   th:id="${searchId}"
                   th:placeholder="${searchPlaceholder}"
                   autocomplete="off"/>
        </div>
    </div>
    <div class="bre-page-header__actions flex items-center gap-unit-md shrink-0">
        <th:block th:insert="~{::headerLeading} ?: ~{::empty}"/>
        <th:block th:replace="~{fragments/stitch-theme :: theme-toggle}"/>
        <th:block th:insert="~{::headerExtra} ?: ~{::empty}"/>
        <th:block th:if="${showNotifications}">
            <div class="bre-header-divider h-8 w-[1px] bg-outline-variant mx-unit-sm"></div>
            <button type="button" class="bre-header-icon-btn p-2 hover:bg-surface-container-low rounded-full transition-all text-on-surface-variant" title="Notifications">
                <span class="material-symbols-outlined">notifications</span>
            </button>
        </th:block>
        <th:block th:if="${showSettings and currentUser != null}">
            <div class="bre-account-menu relative" data-bre-account-menu>
                <button type="button"
                        class="bre-account-menu__trigger flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-full hover:bg-surface-container-low transition-all text-on-surface-variant border border-transparent hover:border-outline-variant/60"
                        data-bre-account-trigger
                        aria-haspopup="menu"
                        aria-expanded="false"
                        title="Account menu">
                    <span class="bre-account-menu__avatar w-8 h-8 rounded-full bg-secondary/15 text-secondary font-semibold text-sm flex items-center justify-center shrink-0 border border-outline-variant/40"
                          th:text="${#strings.toUpperCase(#strings.substring(currentUser.displayName, 0, 1))}">U</span>
                    <span class="material-symbols-outlined text-[18px] hidden sm:inline">expand_more</span>
                </button>
                <div class="bre-account-menu__panel hidden absolute right-0 top-[calc(100%+0.5rem)] w-64 rounded-xl border border-outline-variant bg-surface shadow-lg z-50 overflow-hidden"
                     data-bre-account-panel
                     role="menu"
                     aria-label="Account menu">
                    <div class="px-4 py-3 border-b border-outline-variant bg-surface-container-low/50">
                        <p class="font-medium text-body-sm text-on-surface truncate" th:text="${currentUser.displayName}">User Name</p>
                        <p class="text-[11px] text-on-surface-variant truncate mt-0.5" th:text="${currentUser.email}">user@example.com</p>
                        <p class="text-[10px] text-on-surface-variant/80 mt-1 truncate"
                           th:if="${currentUser.jobTitle != null and !#strings.isEmpty(currentUser.jobTitle)}"
                           th:text="${currentUser.jobTitle}">Job title</p>
                        <span class="inline-block mt-2 px-2 py-0.5 rounded-full bg-secondary/10 text-secondary text-[10px] font-semibold uppercase tracking-wide"
                              th:if="${currentUser.role != null}"
                              th:text="${currentUser.role.name}">Role</span>
                    </div>
                    <div class="py-1">
                        <a th:href="@{/account/password}"
                           class="bre-account-menu__item flex items-center gap-2 px-4 py-2.5 text-body-sm text-on-surface hover:bg-surface-container-low transition-colors"
                           role="menuitem">
                            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">lock_reset</span>
                            Change password
                        </a>
                        <a th:if="${navAccess == null or navAccess['users'] == true}"
                           th:href="@{/users}"
                           class="bre-account-menu__item flex items-center gap-2 px-4 py-2.5 text-body-sm text-on-surface hover:bg-surface-container-low transition-colors"
                           role="menuitem">
                            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">group</span>
                            User Administration
                        </a>
                    </div>
                    <div class="border-t border-outline-variant py-1">
                        <form th:action="@{/logout}" method="post" role="none">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="bre-account-menu__item w-full flex items-center gap-2 px-4 py-2.5 text-body-sm text-error hover:bg-error/5 transition-colors text-left"
                                    role="menuitem">
                                <span class="material-symbols-outlined text-[18px]">logout</span>
                                Sign out
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</header>

<th:block th:fragment="empty"></th:block>

<!-- Unified app page footer -->
<footer th:fragment="page-footer (hint)"
        class="bre-page-footer shrink-0 flex items-center justify-between gap-unit-md px-unit-xl py-unit-sm bg-surface border-t border-outline-variant text-body-sm text-on-surface-variant">
    <div class="bre-page-footer__start flex items-center gap-unit-sm min-w-0">
        <span class="font-semibold text-on-surface">BRE Dashboard</span>
        <span class="opacity-40" aria-hidden="true">·</span>
        <span class="truncate" th:text="${hint}">Internal operations workspace</span>
    </div>
    <div class="bre-page-footer__end flex items-center gap-unit-md shrink-0">
        <th:block th:insert="~{::footerExtra} ?: ~{::empty}"/>
    </div>
</footer>

</body>
</html>
