spring:
  application:
    name: bre-dashboard
  datasource:
    url: jdbc:mysql://localhost:3306/bre_dashboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&tinyInt1isBit=false
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_boolean_jdbc_type: TINYINT
  thymeleaf:
    cache: true
  h2:
    console:
      enabled: false

logging:
  file:
    path: ${BRE_DASHBOARD_LOG_PATH:logs}
  level:
    root: INFO
    com.bredashboard.tester: DEBUG

server:
  port: 8080
  ssl:
    # Server certificate for the dashboard's own hostname (e.g. bflbre-dashboard-prod.bajajfinserv.in).
    enabled: false
    key-store: 
    key-store-password: 
    key-store-type: PKCS12
    key-alias: 
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

bredashboard:
  transaction-dashboard:
    jdbc-url: jdbc:mysql://localhost:3306/bre_underwriting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password
    schema: bre_underwriting
    minute-view: festival_summary_detailed_mins_new
    hourly-view: festival_summary_detailed_new
    otp-table: transaction_details_srcreq_otp
    refresh-seconds: 30
  auth:
    # Form login by default. Production sets Entra in application-prod.yml only.
    mode: dev
    default-role-code: MONITORING
    seed-dev-users: false
    bootstrap-email: admin@localhost
    bootstrap-password: Password123!
    bootstrap-display-name: Administrator
  health:
    monitored-tiers: [UAT]
    refresh-seconds: 30
    refresh-interval-ms: 30000
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    default-actuator-path: /actuator/health
    model-hub:
      enabled: true
      oauth:
        token-url: https://login.microsoftonline.com/710de1d3-2901-4647-89e7-3b01f1c2806d/oauth2/v2.0/token
        client-id: 91becc5d-213e-4d9b-b0dc-e481c31fde4c
        grant-type: password
        username: modelhub@user
        password: modelhubpass
        scope: email openid profile offline_access api://91becc5d-213e-4d9b-b0dc-e481c31fde4c/default
      uat:
        base-url: https://emicardbre.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-uat.bajajfinserv.in
      prod:
        base-url: https://emicardbre-prod.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-prod.bajajfinserv.in
  admin:
    mode: live
    ssh:
      private-key-path: 
      connect-timeout-ms: 10000
      command-timeout-ms: 60000
    servers: []

# Entra/ADID on prod: fill bredashboard.auth.azure in the YAML next to the JAR (deploy/server/application.yml).