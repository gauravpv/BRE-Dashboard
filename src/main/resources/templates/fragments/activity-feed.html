<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="activity-list (activities, emptyMessage)">
<p th:if="${#lists.isEmpty(activities)}" class="text-body-sm text-on-surface-variant text-center py-8" th:text="${emptyMessage}">
    No recent activity yet.
</p>
    <div th:each="event, iterStat : ${activities}" class="flex gap-unit-md activity-feed-entry">
    <div class="mt-1 flex flex-col items-center">
        <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" th:classappend="${event.iconBgClass}">
            <span class="material-symbols-outlined text-base" th:classappend="${event.iconColorClass}" th:text="${event.icon}">info</span>
        </div>
        <div th:unless="${iterStat.last}" class="w-px flex-1 bg-outline-variant my-2 min-h-[12px]"></div>
    </div>
    <div class="min-w-0 pb-1">
        <p class="text-[13px] leading-[1.4] text-primary">
            <span th:text="${event.messagePrefix}">Prefix</span>
            <span class="font-semibold" th:text="${event.messageHighlight}">Highlight</span><span th:text="${event.messageSuffix}">Suffix</span>
        </p>
        <p class="text-[10px] leading-[1.35] text-on-surface-variant mt-0.5 tabular-nums">
            <time th:datetime="${#temporals.format(event.occurredAt, 'yyyy-MM-dd''T''HH:mm:ssXXX')}"
                  th:text="${#temporals.format(event.occurredAt, 'MMM d yyyy, HH:mm')}">May 29 2026, 14:30</time>
            <span th:if="${event.detail != null and !event.detail.isEmpty()}"> • </span>
            <span th:text="${event.detail}">Detail</span>
        </p>
    </div>
</div>
</th:block>

</body>
</html>
