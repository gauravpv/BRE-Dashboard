# Local H2 profile for developers: mvn spring-boot:run -Dspring-boot.run.profiles=local

spring:
  datasource:
    url: jdbc:h2:file:./data/bre-dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false

bredashboard:
  auth:
    seed-dev-users: true
  health:
    model-hub:
      enabled: true
  admin:
    mode: live
