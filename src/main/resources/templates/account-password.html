<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="light" lang="en">
<head>
<th:block th:replace="~{fragments/head :: head(pageTitle='Change password')}"/>
</head>
<body class="opsconsole-app bg-background text-on-background font-body-md">
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<th:block th:replace="~{fragments/page-shell :: page-header(title='Change password', searchPlaceholder='', searchId='', showSearch=false, fixed=true, showNotifications=true, showSettings=true, showUser=false)}"/>

<main class="ml-[240px] pt-20 px-8 max-w-xl">
    <p th:if="${error}" class="mb-4 p-3 rounded-lg bg-error/10 text-error text-body-sm" th:text="${error}">Error</p>
    <p th:if="${success}" class="mb-4 p-3 rounded-lg bg-secondary-container/20 text-on-surface text-body-sm" th:text="${success}">Saved</p>
    <form th:action="@{/account/password}" method="post" class="space-y-4 bg-surface border border-outline-variant rounded-lg p-6">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label class="block text-label-md text-on-surface-variant">Current password
            <input class="mt-1 w-full border border-outline-variant rounded-lg px-3 py-2" type="password" name="currentPassword" required autocomplete="current-password"/>
        </label>
        <label class="block text-label-md text-on-surface-variant">New password
            <input class="mt-1 w-full border border-outline-variant rounded-lg px-3 py-2" type="password" name="newPassword" minlength="8" required autocomplete="new-password"/>
        </label>
        <label class="block text-label-md text-on-surface-variant">Confirm new password
            <input class="mt-1 w-full border border-outline-variant rounded-lg px-3 py-2" type="password" name="confirmPassword" minlength="8" required autocomplete="new-password"/>
        </label>
        <button class="px-4 py-2 rounded-lg bg-secondary text-on-secondary" type="submit">Update password</button>
    </form>
</main>
</body>
</html>
