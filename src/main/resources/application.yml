spring:
  application:
    name: opsconsole
  datasource:
    # Embedded file DB only (no AUTO_SERVER — avoids stale remote H2 connection timeouts)
    url: jdbc:h2:file:./data/opsconsole;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

opsconsole:
  features:
    api-tester-enabled: false
  transaction-dashboard:
    # mock-mode keeps the dashboard usable locally. Set false and provide
    # TXN_DB_* values to read the production reporting views.
    mock-mode: ${TXN_DASHBOARD_MOCK_MODE:true}
    jdbc-url: ${TXN_DB_URL:}
    username: ${TXN_DB_USERNAME:}
    password: ${TXN_DB_PASSWORD:}
    schema: ${TXN_DB_SCHEMA:bre_underwriting}
    minute-view: festival_summary_detailed_mins_new
    hourly-view: festival_summary_detailed_new
    otp-table: transaction_details_srcreq_otp
    refresh-seconds: 60
  auth:
    # dev = email/password; azure = Microsoft Entra ID (Azure AD)
    mode: dev
    default-role-code: MONITORING
    # Dev seed passwords: admin@opsconsole.local / Admin@123,
    # tester@opsconsole.local / Tester@123, monitoring@opsconsole.local / Monitoring@123
    # (legacy: operator@opsconsole.local / Operator@123, viewer@opsconsole.local / Viewer@123)
  health:
    refresh-seconds: 30
    refresh-interval-ms: 30000
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    default-actuator-path: /actuator/health
    model-hub:
      enabled: true
      mock-mode: true
      uat:
        base-url: https://emicardbre.bajajfinserv.in
      prod:
        base-url: https://emicardbre-prod.bajajfinserv.in
  bajaj-tester:
    mock-mode: true
    uat:
      base-url: https://sauat.bajajfinserv.in/apis
      operation-list-path: operationallist
      encryption-key: "2026Unpf7T7Mr4kNAHecXKolYoD9tiOT"
      encryption-iv: "2026JHNjiJSboivg"
      headers:
        Authorization: ${BAJAJ_UAT_AUTHORIZATION:WWNRYkYyRUlmNUZ4bldUOjI3YzgyQUtSa0pRYTQ4bVdSOHFCaDQzWTJTZQ==}
        connection-from: Upgrade-ws
        source: hqoYIrMWpVbGXPh2pqBKJxfTo110as
        token: ${BAJAJ_UAT_TOKEN:}
        additionalinfo5: cbc
        additionalinfo1: ${BAJAJ_UAT_ADDITIONALINFO1:}
        subscriptionid: ${BAJAJ_UAT_SUBSCRIPTION_ID:}
      request-body:
        channel: hqoYIrMWpVbGXPh2pqBKJxfTo110as
        appversion: hqoYIrMWpVbGXPh2pqBKJxfTo110as_web_1.0.0.158
        deviceId: hqoYIrMWpVbGXPh2pqBKJxfTo110as
    prod:
      base-url: https://superapp.bajajfinserv.in/apis
      operation-list-path: operationallist
      encryption-key: ${BAJAJ_PROD_ENCRYPTION_KEY:2026Unpf7T7Mr4kNAHecXKolYoD9tiOT}
      encryption-iv: ${BAJAJ_PROD_ENCRYPTION_IV:2026JHNjiJSboivg}
      headers:
        Authorization: ${BAJAJ_PROD_AUTHORIZATION:}
        connection-from: Upgrade-ws
        source: ${BAJAJ_PROD_SOURCE:}
        token: ${BAJAJ_PROD_TOKEN:}
        additionalinfo5: cbc
        additionalinfo1: ${BAJAJ_PROD_ADDITIONALINFO1:}
        subscriptionid: ${BAJAJ_PROD_SUBSCRIPTION_ID:}
      request-body:
        channel: ${BAJAJ_PROD_CHANNEL:}
        appversion: ${BAJAJ_PROD_APPVERSION:}
        deviceId: ${BAJAJ_PROD_DEVICE_ID:}
  # Monitored systems (IP, port, environment) are stored in the database (monitored_hosts).
  # Add or edit systems from the System Health page; they persist across restarts.
  admin:
    # dev = simulate SSH; live = real SSH (requires OPS_SSH_KEY_PATH)
    mode: dev
    ssh:
      private-key-path: ${OPS_SSH_KEY_PATH:}
      connect-timeout-ms: 10000
      command-timeout-ms: 60000
    # Linux host prerequisites (live mode):
    # - opsconsole SSH user with key login (OPS_SSH_KEY_PATH)
    # - start/stop/restart scripts executable on the server
    # - sudoers for properties: NOPASSWD tee/cp on configured properties-path only
    servers:
      - name: dev-linux-01
        host: 127.0.0.1
        ssh-user: opsconsole
        services:
          - name: payment-api
            description: Core Payment Processing Engine
            port: 8081
            category: Payment Services
            start-script: /opt/payment/bin/start.sh
            stop-script: /opt/payment/bin/stop.sh
            restart-script: /opt/payment/bin/restart.sh
            properties-path: /opt/payment/config/application.properties
          - name: auth-core
            description: User Auth Core
            port: 8082
            category: User Auth Core
            start-script: /opt/auth/bin/start.sh
            stop-script: /opt/auth/bin/stop.sh
            restart-script: /opt/auth/bin/restart.sh
            properties-path: /opt/auth/config/application.properties

---
# Azure AD login — set opsconsole.auth.mode=azure and env vars below.
# App registration redirect URI: http://localhost:8080/login/oauth2/code/azure
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

opsconsole:
  auth:
    mode: azure
