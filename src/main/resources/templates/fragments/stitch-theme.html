<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="theme-head">
<script>
    (function () {
        var t = localStorage.getItem('opsconsole-theme');
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
        if (localStorage.getItem('opsconsole-sidebar-collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-collapsed');
        }
    })();
</script>
<link rel="stylesheet" th:href="@{/css/opsconsole.css}"/>
<script defer th:src="@{/js/stitch-theme.js}"></script>
<script defer th:src="@{/js/opsconsole-sidebar.js}"></script>
<script defer th:src="@{/js/opsconsole-header.js}"></script>
</th:block>
<th:block th:fragment="theme-head-light">
<script>
    (function () {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
    })();
</script>
<link rel="stylesheet" th:href="@{/css/opsconsole.css}"/>
</th:block>
</head>
<body>
<button th:fragment="theme-toggle" type="button" data-stitch-theme-toggle
        class="p-2 hover:bg-surface-container-low rounded-full transition-all text-on-surface-variant dark:text-on-primary-container"
        aria-label="Toggle light/dark theme" title="Toggle theme">
    <span class="material-symbols-outlined text-[22px]" data-stitch-theme-icon="light">light_mode</span>
    <span class="material-symbols-outlined text-[22px] hidden" data-stitch-theme-icon="dark">dark_mode</span>
</button>
</body>
</html>
