# UAT overlay. Activate with SPRING_PROFILES_ACTIVE=uat
# Override only environment-specific hosts/URLs here.
# This file contains defaults; override with YAML file placed next to the JAR.

server:
  port: 8443
  forward-headers-strategy: native
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      host-header: X-Forwarded-Host
  ssl:
    enabled: true
    key-store: dashboard.p12
    key-store-password: 
    key-store-type: PKCS12
    key-alias: 
  servlet:
    session:
      cookie:
        secure: true

bredashboard:
  health:
    monitored-tiers: [UAT]
    model-hub:
      enabled: true
      uat:
        base-url: https://emicardbre.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-uat.bajajfinserv.in
      prod:
        base-url: https://emicardbre-prod.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-prod.bajajfinserv.in
  bajaj-tester:
    uat:
      base-url: https://sauat.bajajfinserv.in/apis
      operation-list-path: operationallist
      token-path: oauth-token
      token-ttl-seconds: 600
      operation-list-ttl-seconds: 86400
      quote-encrypted-body: true
      encryption-key:
      encryption-iv:
      headers:
        Authorization:
        connection-from: Upgrade-ws
        source:
        token:
        additionalinfo5: cbc
        additionalinfo1:
        subscriptionid:
      api-headers:
        connection-from: rest
      request-body:
        channel:
        appversion:
        deviceId:
      token-request-body:
        grant_type: password
        deviceId:
        channelId: 740
        username:
        passwordType: password
        password:
  admin:
    mode: live
    servers: []
