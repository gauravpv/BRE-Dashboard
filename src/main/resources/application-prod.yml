# Production overlay. Activate with SPRING_PROFILES_ACTIVE=prod

spring:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8443}
  # So OAuth redirect_uri uses https://bflbre-dashboard-prod.bajajfinserv.in when a proxy terminates TLS.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      host-header: X-Forwarded-Host
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEYSTORE:}
    key-store-password: ${SERVER_SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SERVER_SSL_KEY_ALIAS:}
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
        http-only: true

opsconsole:
  auth:
    seed-dev-users: false
  health:
    model-hub:
      enabled: true
      oauth:
        username: ""
        password: ""
      uat:
        base-url: https://emicardbre.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-uat.bajajfinserv.in
      prod:
        base-url: https://emicardbre-prod.bajajfinserv.in
        base-urls:
          - https://bfldaasbre-prod.bajajfinserv.in
  bajaj-tester:
    uat:
      base-url: https://sauat.bajajfinserv.in/apis
    prod:
      base-url: https://superapp.bajajfinserv.in/apis
  admin:
    mode: live
